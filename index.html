<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="随手记">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>随手记</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#1c1c1e;font-size:18px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 96px}
h1{font-size:18px;font-weight:600;margin:8px 0 12px;text-align:center;color:#8e8e93;letter-spacing:3px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;border:0;background:#fff;color:#8e8e93;border-radius:10px;padding:11px 0;font-size:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tabs button.on{background:#f97316;color:#fff;font-weight:600}
.card{background:#fff;border-radius:16px;padding:14px 16px 16px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
textarea,input,button{font-family:inherit}
#text{width:100%;border:0;outline:0;resize:none;font-size:19px;line-height:1.55;color:#1c1c1e;background:transparent;min-height:56px;padding:4px 0}
#text::placeholder{color:#c7c7cc}
.btn{width:100%;border:0;border-radius:12px;font-size:21px;font-weight:600;padding:16px 0;background:#f97316;color:#fff;margin-top:8px}
.btn:active{opacity:.82}
.tools{display:flex;gap:8px;margin-top:14px}
#q{flex:1;border:1px solid #e8e8ed;background:#fff;border-radius:10px;padding:11px 14px;font-size:17px;outline:0;color:#1c1c1e}
#q::placeholder{color:#c7c7cc}
.filters{display:flex;gap:8px;margin-top:10px}
.filters button{flex:1;border:1px solid #e5e5ea;background:#fff;color:#8e8e93;border-radius:10px;padding:9px 0;font-size:15px}
.filters button.on{background:#fff7ed;border-color:#f97316;color:#ea580c;font-weight:600}
.day{margin:18px 2px 8px;font-size:14px;color:#aeaeb2;display:flex;justify-content:space-between}
.item{background:#fff;border-radius:12px;padding:13px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer}
.item .row1{display:flex;align-items:flex-start;gap:10px}
.item .body{flex:1;min-width:0;font-size:18px;line-height:1.5;color:#1c1c1e;white-space:pre-wrap;word-break:break-word}
.item .amt{font-size:20px;font-weight:600;color:#f97316;white-space:nowrap;flex:0 0 auto}
.item .meta{font-size:12px;color:#c7c7cc;margin-top:4px}
.hl{color:#f97316;font-weight:600}
.empty{text-align:center;color:#c7c7cc;padding:56px 0;font-size:16px;line-height:2}
.edit textarea{width:100%;border:1px solid #f97316;border-radius:10px;padding:10px;font-size:18px;line-height:1.5;outline:0;resize:vertical;min-height:80px;color:#1c1c1e}
.edit .acts{display:flex;gap:10px;margin-top:10px}
.edit .acts button{flex:1;border:0;border-radius:10px;padding:13px 0;font-size:17px;font-weight:600}
.ok{background:#f97316;color:#fff}
.cancel{background:#f2f2f7;color:#3a3a3c}
.del{background:#fef2f2;color:#ef4444}
.tbl{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.th,.tr{display:grid;grid-template-columns:58px 1fr 64px;align-items:start}
.th{background:#fafafa;border-bottom:1px solid #ececf0;font-size:13px;color:#8e8e93}
.th div,.tr div{padding:11px 8px}
.tr{border-bottom:1px solid #f2f2f7;font-size:16px;color:#1c1c1e;cursor:pointer}
.tr:last-child{border-bottom:0}
.tr .c1{font-size:13px;color:#aeaeb2;padding-top:12px}
.tr .c2{white-space:pre-wrap;word-break:break-word;line-height:1.45}
.tr .c3{text-align:right;font-weight:600;color:#f97316;font-size:17px}
.tr:active{background:#fafafa}
.btn2{width:100%;border:1px solid #e5e5ea;border-radius:12px;font-size:17px;font-weight:600;padding:14px 0;background:#fff;color:#3a3a3c;margin-top:14px}
.btn2:active{opacity:.7}
.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(245,245,247,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid #e5e5ea}
.foot .in{max-width:560px;margin:0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:10px}
.foot .sum{font-size:16px;color:#8e8e93}
.foot .sum b{font-size:21px;color:#1c1c1e}
.mini{border:0;background:transparent;color:#aeaeb2;font-size:13px;padding:8px}
.foot .acts{display:flex;gap:4px;flex:0 0 auto}
.foot .acts .mini{border:1px solid #e5e5ea;border-radius:9px;color:#3a3a3c;background:#fff;padding:8px 12px;font-size:14px;font-weight:600}
.tip{margin:12px 2px 0;font-size:13px;color:#f59e0b;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>随 手 记</h1>
  <div class="tabs">
    <button id="vList" class="on">随手记</button>
    <button id="vTable">表格</button>
  </div>

  <div id="viewList">
    <div class="card">
      <textarea id="text" rows="2" placeholder="想记什么就写什么…" autocorrect="off" spellcheck="false"></textarea>
      <button class="btn" id="add">记下来</button>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="找一找" autocomplete="off">
    </div>
    <div class="filters">
      <button id="fAll" class="on">全部</button>
      <button id="fMoney">只看钱</button>
    </div>
    <div class="tip" id="tip"></div>
    <div id="list"></div>
  </div>

  <div id="viewTable" style="display:none">
    <div class="tbl">
      <div class="th"><div class="c1">日期</div><div class="c2">内容</div><div class="c3">金额</div></div>
      <div id="tblBody"></div>
    </div>
    <button class="btn2" id="csv">导出表格（Excel 能打开）</button>
  </div>
</div>
<div class="foot">
  <div class="in">
    <div class="sum" id="sum"></div>
    <div class="acts">
      <button class="mini" id="backup">存一份</button>
      <button class="mini" id="restore">恢复</button>
    </div>
  </div>
</div>
<input id="file" type="file" accept=".txt,.json,application/json" style="display:none">
<script>
(function () {
  var KEY = 'jz_v2', DRAFT = 'jz_draft', OLD = 'jz_v1';
  var AMT_RE = /(\d+(?:\.\d{1,2})?)\s*(?:元钱|块钱|[块元¥￥])/;
  var recs = [], filter = 'all', editing = null, view = 'list';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function parseAmount(t) {
    var m = String(t).match(AMT_RE);
    if (!m) return 0;
    var n = parseFloat(m[1]);
    if (!isFinite(n) || n <= 0 || n > 1e8) return 0;
    return Math.round(n * 100);
  }
  function fmt(c) { var s = (c / 100).toFixed(2); return s.replace(/\.00$/, '').replace(/(\.\d)0$/, '$1'); }
  function dayKey(ts) { var d = new Date(ts); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function mmdd(k) { var p = k.split('-'); return p[1] + '-' + p[2]; }
  function hhmm(ts) { var d = new Date(ts); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function dayLabel(k, today) {
    if (k === today) return '今天';
    var y = new Date(); y.setDate(y.getDate() - 1);
    if (k === dayKey(y.getTime())) return '昨天';
    var p = k.split('-');
    return p[1].replace(/^0/, '') + '月' + p[2].replace(/^0/, '') + '日';
  }

  function load() {
    try { recs = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { recs = []; }
    if (!Array.isArray(recs)) recs = [];
    recs = recs.filter(function (r) { return r && typeof r.ts === 'number' && typeof r.text === 'string'; });
    if (!recs.length) {
      try {
        var old = JSON.parse(localStorage.getItem(OLD) || '[]');
        if (Array.isArray(old) && old.length) {
          old.forEach(function (o) {
            if (!o || !o.c) return;
            recs.push({ id: String(o.ts) + Math.random().toString(36).slice(2, 6), ts: o.ts, text: (o.note || '') + ' ' + fmt(o.c) + '元', amount: o.c, amtOff: false });
          });
          save();
        }
      } catch (e) { }
    }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(recs)); return true; }
    catch (e) { alert('存不进去了，可能是手机空间满了'); return false; }
  }
  function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.max(56, el.scrollHeight) + 'px'; }

  function render() {
    var q = $('q').value.trim().toLowerCase();
    var today = dayKey(Date.now());
    if (view === 'list') {
      var list = $('list');
      list.innerHTML = '';
      var arr = recs.filter(function (r) {
        var hasMoney = r.amount && !r.amtOff;
        if (filter === 'money' && !hasMoney) return false;
        if (q && r.text.toLowerCase().indexOf(q) < 0) return false;
        return true;
      });
      if (!arr.length) {
        var e = document.createElement('div'); e.className = 'empty';
        e.innerHTML = q ? '没找到<br>换个词试试' : (filter === 'money' ? '还没有记过花钱的事' : '还什么都没记<br>上面写一句，点「记下来」');
        list.appendChild(e);
      } else {
        var groups = {}, order = [];
        arr.slice().sort(function (a, b) { return b.ts - a.ts; }).forEach(function (r) {
          var k = dayKey(r.ts);
          if (!groups[k]) { groups[k] = []; order.push(k); }
          groups[k].push(r);
        });
        order.forEach(function (k) {
          var items = groups[k], daySum = 0;
          items.forEach(function (r) { if (r.amount && !r.amtOff) daySum += r.amount; });
          var h = document.createElement('div'); h.className = 'day';
          h.innerHTML = '<span>' + dayLabel(k, today) + '</span><span>' + (daySum ? '花 ' + fmt(daySum) : '') + '</span>';
          list.appendChild(h);
          items.forEach(function (r) { list.appendChild(buildItem(r)); });
        });
      }
    } else {
      var tb = $('tblBody');
      tb.innerHTML = '';
      var arr2 = recs.slice().sort(function (a, b) { return b.ts - a.ts; });
      if (!arr2.length) {
        tb.innerHTML = '<div class="tr"><div class="c2" style="padding:28px 8px;color:#c7c7cc">还没有内容</div></div>';
      } else {
        arr2.forEach(function (r) {
          var row = document.createElement('div'); row.className = 'tr';
          var c1 = document.createElement('div'); c1.className = 'c1'; c1.textContent = mmdd(dayKey(r.ts));
          var c2 = document.createElement('div'); c2.className = 'c2'; c2.textContent = r.text;
          var c3 = document.createElement('div'); c3.className = 'c3';
          if (r.amount && !r.amtOff) c3.textContent = fmt(r.amount);
          row.appendChild(c1); row.appendChild(c2); row.appendChild(c3);
          row.onclick = function () { switchView('list', r.id); };
          tb.appendChild(row);
        });
      }
    }

    var mk = dayKey(Date.now()).slice(0, 7), monthOut = 0;
    recs.forEach(function (r) { if (r.amount && !r.amtOff && dayKey(r.ts).slice(0, 7) === mk) monthOut += r.amount; });
    $('sum').innerHTML = monthOut ? '本月花 <b>' + fmt(monthOut) + '</b> 元' : '本月还没记花钱的事';

    var last = recs.length ? recs[recs.length - 1].ts : 0;
    if (last && Date.now() - last > 5 * 864e5) {
      $('tip').style.display = 'block';
      $('tip').textContent = '好久没记了。为了保险，点右下角「备份」存一份。';
    } else { $('tip').style.display = 'none'; }
  }

  function buildItem(r) {
    var el = document.createElement('div');
    el.className = 'item';
    if (editing === r.id) {
      el.className = 'item edit';
      var ta = document.createElement('textarea');
      ta.value = r.text;
      var acts = document.createElement('div'); acts.className = 'acts';
      var ok = document.createElement('button'); ok.className = 'ok'; ok.textContent = '好了';
      var cancel = document.createElement('button'); cancel.className = 'cancel'; cancel.textContent = '不改了';
      var del = document.createElement('button'); del.className = 'del'; del.textContent = '删掉';
      ok.onclick = function (e) {
        e.stopPropagation();
        var v = ta.value.trim();
        if (!v) { if (confirm('内容空了，要删掉这条吗？')) { recs = recs.filter(function (x) { return x.id !== r.id; }); save(); editing = null; render(); } return; }
        r.text = v.slice(0, 2000);
        r.amount = parseAmount(r.text);
        save(); editing = null; render();
      };
      del.onclick = function (e) {
        e.stopPropagation();
        if (!confirm('删掉这条？\n' + r.text.slice(0, 40))) return;
        recs = recs.filter(function (x) { return x.id !== r.id; });
        save(); editing = null; render();
      };
      cancel.onclick = function (e) { e.stopPropagation(); editing = null; render(); };
      acts.appendChild(ok); acts.appendChild(cancel); acts.appendChild(del);
      el.appendChild(ta); el.appendChild(acts);
      setTimeout(function () { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 30);
      return el;
    }
    var row = document.createElement('div'); row.className = 'row1';
    var body = document.createElement('div'); body.className = 'body';
    body.innerHTML = esc(r.text).replace(AMT_RE, function (m) { return '<span class="hl">' + m + '</span>'; });
    row.appendChild(body);
    if (r.amount && !r.amtOff) {
      var a = document.createElement('div'); a.className = 'amt'; a.textContent = fmt(r.amount);
      row.appendChild(a);
    }
    el.appendChild(row);
    var meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = hhmm(r.ts);
    el.appendChild(meta);
    el.onclick = function () { editing = r.id; render(); };
    return el;
  }

  function switchView(v, editId) {
    view = v;
    editing = editId || null;
    $('vList').className = v === 'list' ? 'on' : '';
    $('vTable').className = v === 'table' ? 'on' : '';
    $('viewList').style.display = v === 'list' ? '' : 'none';
    $('viewTable').style.display = v === 'table' ? '' : 'none';
    render();
    if (v === 'list' && editId) setTimeout(function () { window.scrollTo({ top: 0 }); }, 10);
  }
  $('vList').onclick = function () { switchView('list'); };
  $('vTable').onclick = function () { switchView('table'); };

  function add() {
    var t = $('text').value.trim();
    if (!t) { $('text').focus(); return; }
    var amt = parseAmount(t);
    recs.push({
      id: String(Date.now()) + Math.random().toString(36).slice(2, 6),
      ts: Date.now(), text: t.slice(0, 2000), amount: amt, amtOff: !amt
    });
    if (save()) {
      $('text').value = '';
      autoGrow($('text'));
      localStorage.removeItem(DRAFT);
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      $('text').focus();
      if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) { }
    }
  }
  $('add').onclick = add;
  $('text').oninput = function () {
    autoGrow(this);
    try { localStorage.setItem(DRAFT, this.value); } catch (e) { }
  };
  $('text').onkeydown = function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); add(); } };
  $('q').oninput = function () { render(); };
  $('fAll').onclick = function () { filter = 'all'; $('fAll').className = 'on'; $('fMoney').className = ''; render(); };
  $('fMoney').onclick = function () { filter = 'money'; $('fAll').className = ''; $('fMoney').className = 'on'; render(); };

  function download(name, text, mime) {
    try {
      var blob = new Blob([text], { type: mime });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 1500);
      return true;
    } catch (e) { return false; }
  }

  $('csv').onclick = function () {
    if (!recs.length) { alert('还没有内容'); return; }
    var head = '日期,时间,内容,金额\n';
    var rows = recs.slice().sort(function (a, b) { return b.ts - a.ts; }).map(function (r) {
      var text = r.text.replace(/"/g, '""').replace(/\r?\n/g, ' ');
      var amt = (r.amount && !r.amtOff) ? (r.amount / 100).toFixed(2) : '';
      return '"' + dayKey(r.ts) + '","' + hhmm(r.ts) + '","' + text + '","' + amt + '"';
    }).join('\r\n');
    // \ufeff 是给 Excel 认中文用的
    var ok = download('随手记-表格-' + dayKey(Date.now()) + '.csv', '\ufeff' + head + rows, 'text/csv;charset=utf-8');
    if (!ok) alert('这台手机不支持直接下载');
  };

  $('backup').onclick = function () {
    if (!recs.length) { alert('还没记过，不用备份'); return; }
    var data = JSON.stringify({ app: 'suishouji', v: 2, exportedAt: new Date().toISOString(), records: recs }, null, 1);
    if (!download('随手记备份-' + dayKey(Date.now()) + '.txt', data, 'application/json')) alert('这台手机不支持直接下载');
  };

  $('restore').onclick = function () { $('file').click(); };
  $('file').onchange = function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function (e) {
      var arr = null;
      try {
        var raw = String(e.target.result).replace(/^\ufeff/, '');
        var o = JSON.parse(raw);
        arr = Array.isArray(o) ? o : (o && Array.isArray(o.records) ? o.records : null);
      } catch (err) { alert('这个文件读不出来，可能不是随手记的备份。'); return; }
      if (!arr) { alert('这个文件不像随手记的备份。'); return; }
      var good = arr.filter(function (r) { return r && typeof r.ts === 'number' && typeof r.text === 'string' && r.text; });
      if (!good.length) { alert('备份里没有能读的记录。'); return; }
      var seen = {};
      recs.forEach(function (r) { seen[r.ts + '|' + r.text] = 1; });
      var add = 0;
      good.forEach(function (r) {
        var k = r.ts + '|' + r.text;
        if (seen[k]) return;
        seen[k] = 1;
        var t = String(r.text).slice(0, 2000);
        recs.push({
          id: String(r.ts) + Math.random().toString(36).slice(2, 6),
          ts: r.ts,
          text: t,
          amount: typeof r.amount === 'number' ? r.amount : parseAmount(t),
          amtOff: false
        });
        add++;
      });
      if (!add) { alert('备份里 ' + good.length + ' 条都已经有了，没有新增。'); return; }
      if (!save()) return;
      alert('恢复好了：新增 ' + add + ' 条，现在一共 ' + recs.length + ' 条。');
      render();
    };
    fr.readAsText(f, 'utf-8');
    this.value = '';
  };

  load();
  try { var d = localStorage.getItem(DRAFT); if (d) { $('text').value = d; } } catch (e) { }
  setTimeout(function () { autoGrow($('text')); }, 0);
  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
  }
})();
</script>
</body>
</html>
