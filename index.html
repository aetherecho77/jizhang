<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记账">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>记账</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#1c1c1e;font-size:18px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 100px}
h1{font-size:19px;font-weight:600;margin:6px 0 16px;text-align:center;color:#8e8e93;letter-spacing:2px}
.card{background:#fff;border-radius:16px;padding:14px 16px 16px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.type{display:flex;gap:8px;margin-bottom:12px}
.type button{flex:1;border:1px solid #e5e7eb;background:#fff;color:#8e8e93;border-radius:10px;padding:10px 0;font-size:17px;font-family:inherit}
.type button.on{background:#fff7ed;border-color:#f97316;color:#ea580c;font-weight:600}
.amt{display:flex;align-items:center;gap:8px;border-bottom:1px solid #ececf0;padding-bottom:8px}
.amt .cur{font-size:30px;color:#c7c7cc;line-height:1}
.amt input{flex:1;border:0;outline:0;font-size:40px;font-weight:600;background:transparent;color:#111;min-width:0;padding:0;font-family:inherit}
.amt input::placeholder{color:#e5e5ea}
.type.in .amt{border-bottom-color:#d1fae5}
.type.in .amt .cur{color:#6ee7b7}
.note{width:100%;border:0;outline:0;font-size:18px;padding:12px 0 4px;background:transparent;color:#3a3a3c;font-family:inherit}
.note::placeholder{color:#c7c7cc}
.btn{width:100%;border:0;border-radius:12px;font-size:21px;font-weight:600;padding:17px 0;background:#f97316;color:#fff;font-family:inherit}
.btn:active{opacity:.82}
.btn.in{background:#10b981}
.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(245,245,247,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid #e5e5ea}
.foot .in{max-width:560px;margin:0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:10px}
.foot .sum{font-size:16px;color:#8e8e93}
.foot .sum b{font-size:21px;color:#1c1c1e}
.mini{border:0;background:transparent;color:#aeaeb2;font-size:13px;padding:8px;font-family:inherit}
.day{margin:20px 2px 8px;font-size:14px;color:#aeaeb2;display:flex;justify-content:space-between}
.item{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.item .main{flex:1;min-width:0}
.item .n{font-size:17px;color:#3a3a3c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t{font-size:12px;color:#c7c7cc;margin-top:2px}
.item .v{font-size:21px;font-weight:600;color:#1c1c1e;white-space:nowrap}
.item .v.in{color:#10b981}
.del{border:0;background:#fef2f2;color:#ef4444;border-radius:8px;width:46px;height:46px;font-size:16px;flex:0 0 46px;font-family:inherit}
.del:active{opacity:.7}
.empty{text-align:center;color:#c7c7cc;padding:64px 0;font-size:16px;line-height:1.9}
.tip{margin:14px 2px 0;font-size:13px;color:#f59e0b;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>记 账</h1>
  <div class="card">
    <div class="type" id="typeBox">
      <button id="tOut" class="on">支出</button>
      <button id="tIn">收入</button>
    </div>
    <div class="amt">
      <span class="cur">¥</span>
      <input id="amount" type="text" inputmode="decimal" placeholder="0" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <input id="note" class="note" type="text" placeholder="写点什么（可不填）" autocomplete="off" maxlength="30">
    <button class="btn" id="add" style="margin-top:14px">记一笔</button>
  </div>
  <div class="tip" id="tip"></div>
  <div id="list"></div>
</div>
<div class="foot">
  <div class="in">
    <div class="sum" id="sum"></div>
    <button class="mini" id="backup">备份</button>
  </div>
</div>
<script>
(function(){
  var KEY='jz_v1';
  var recs=[], type='out';
  function $(id){return document.getElementById(id);}

  function load(){
    try{var s=localStorage.getItem(KEY);recs=s?JSON.parse(s):[];}catch(e){recs=[];}
    if(!Array.isArray(recs))recs=[];
    recs=recs.filter(function(r){return r&&typeof r.ts==='number'&&typeof r.c==='number'&&r.c>0;});
  }
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(recs));return true;}
    catch(e){alert('存不进去了，可能是手机空间满了');return false;}
  }
  function fmt(c){var s=(c/100).toFixed(2);return s.replace(/\.00$/,'').replace(/(\.\d)0$/,'$1');}
  function dayKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  function dayLabel(k,today){
    if(k===today)return '今天';
    var y=new Date();y.setDate(y.getDate()-1);
    if(k===dayKey(y.getTime()))return '昨天';
    var p=k.split('-');
    return p[1].replace(/^0/,'')+'月'+p[2].replace(/^0/,'')+'日';
  }

  function render(){
    var list=$('list'), today=dayKey(Date.now());
    list.innerHTML='';
    if(!recs.length){
      var e=document.createElement('div');e.className='empty';
      e.innerHTML='还没有记过<br>先在上面输金额，再点「记一笔」';
      list.appendChild(e);
    }else{
      var groups={},order=[];
      for(var i=recs.length-1;i>=0;i--){
        var r=recs[i],k=dayKey(r.ts);
        if(!groups[k]){groups[k]=[];order.push(k);}
        groups[k].push(r);
      }
      order.forEach(function(k){
        var items=groups[k],out=0;
        items.forEach(function(r){if(r.type!=='in')out+=r.c;});
        var h=document.createElement('div');h.className='day';
        h.innerHTML='<span>'+dayLabel(k,today)+'</span><span>花 '+fmt(out)+'</span>';
        list.appendChild(h);
        items.forEach(function(r){
          var el=document.createElement('div');el.className='item';
          var main=document.createElement('div');main.className='main';
          var n=document.createElement('div');n.className='n';
          n.textContent=r.note||(r.type==='in'?'收入':'支出');
          var t=document.createElement('div');t.className='t';
          var d=new Date(r.ts);
          t.textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
          main.appendChild(n);main.appendChild(t);
          var v=document.createElement('div');v.className='v'+(r.type==='in'?' in':'');
          v.textContent=(r.type==='in'?'+':'-')+fmt(r.c);
          var b=document.createElement('button');b.className='del';b.textContent='删';
          b.onclick=function(){
            if(!confirm('删掉这条？\n'+(r.type==='in'?'+':'-')+fmt(r.c)+' 元 '+(r.note||'')))return;
            recs=recs.filter(function(x){return x.id!==r.id;});
            if(save())render();
          };
          el.appendChild(main);el.appendChild(v);el.appendChild(b);
          list.appendChild(el);
        });
      });
    }

    var mk=dayKey(Date.now()).slice(0,7),out=0,inn=0;
    recs.forEach(function(r){
      if(dayKey(r.ts).slice(0,7)===mk){if(r.type==='in')inn+=r.c;else out+=r.c;}
    });
    var s='本月花 <b>'+fmt(out)+'</b> 元';
    if(inn>0)s+=' · 收 '+fmt(inn);
    $('sum').innerHTML=s;

    // 超过 5 天没记，提示（iOS 长期不打开可能清数据）
    var last=recs.length?recs[recs.length-1].ts:0;
    if(last&&Date.now()-last>5*864e5){
      $('tip').style.display='block';
      $('tip').textContent='好久没记了。为了保险，点右下角「备份」存一份。';
    }else{
      $('tip').style.display='none';
    }
  }

  function setType(t){
    type=t;
    $('tOut').className=(t==='out'?'on':'');
    $('tIn').className=(t==='in'?'on':'');
    $('typeBox').className=(t==='in'?'type in':'type');
    $('add').className=(t==='in'?'btn in':'btn');
  }
  $('tOut').onclick=function(){setType('out');$('amount').focus();};
  $('tIn').onclick=function(){setType('in');$('amount').focus();};

  function add(){
    var raw=$('amount').value.trim();
    if(!raw){$('amount').focus();return;}
    var n=parseFloat(raw.replace(/[^\d.]/g,''));
    if(!isFinite(n)||n<=0){alert('金额没看懂，再输一次');$('amount').select();return;}
    var c=Math.round(n*100);
    if(c<=0||c>1e9){alert('这个数太大了');return;}
    recs.push({
      id:String(Date.now())+String(Math.floor(Math.random()*1000)),
      ts:Date.now(),c:c,type:type,
      note:$('note').value.trim().slice(0,30)
    });
    if(save()){
      $('amount').value='';$('note').value='';
      render();
      $('amount').focus();
      if(navigator.vibrate)try{navigator.vibrate(12);}catch(e){}
    }
  }
  $('add').onclick=add;
  $('amount').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();add();}};
  $('note').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();add();}};

  $('backup').onclick=function(){
    if(!recs.length){alert('还没记过，不用备份');return;}
    try{
      var data=JSON.stringify({app:'jizhang',v:1,exportedAt:new Date().toISOString(),records:recs},null,1);
      var blob=new Blob([data],{type:'application/json'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='记账备份-'+dayKey(Date.now())+'.txt';
      document.body.appendChild(a);a.click();
      setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href);},1500);
    }catch(e){alert('这台手机不支持直接下载，可以截屏保存：\n'+JSON.stringify(recs));}
  };

  load();render();setType('out');

  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
